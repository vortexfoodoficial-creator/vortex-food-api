<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cardápio digital</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#0f172a;color:#f8fafc}header{text-align:center;padding:22px;background:#1e293b}main{max-width:1000px;margin:auto;padding:16px;display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.panel{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px}#products{display:grid;gap:10px}.item,.cartrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #334155}button{background:#f97316;color:white;border:0;border-radius:8px;padding:10px;font-weight:bold}input,textarea,select{width:100%;padding:10px;margin-top:5px;background:#0f172a;color:white;border:1px solid #475569;border-radius:8px}label{display:block;margin-top:10px;color:#cbd5e1;font-size:13px}.green{background:#22c55e;color:#052e16;width:100%;margin-top:15px}#done{display:none;max-width:460px;margin:25px auto;text-align:center}.code{font-size:40px;letter-spacing:8px;color:#22c55e;padding:18px;border:1px dashed #22c55e;border-radius:12px}@media(max-width:700px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h2 id="store">Cardápio Digital</h2><p>Faça seu pedido para entrega</p></header><p id="status" style="text-align:center;padding:20px">Carregando cardápio...</p>
<main id="app" style="display:none"><section class="panel"><h3>Produtos</h3><div id="products"></div></section><section class="panel"><h3>Seu pedido</h3><div id="cart"></div><h3 id="total">R$ 0,00</h3><h3>Entrega</h3>
<label>Nome *<input id="name" maxlength="80"></label><label>WhatsApp *<input id="phone" maxlength="20"></label><label>Rua *<input id="street" maxlength="120"></label><label>Número *<input id="number" maxlength="15"></label><label>Bairro *<input id="neighborhood" maxlength="80"></label><label>Complemento<input id="complement" maxlength="100"></label><label>Observação<textarea id="obs" maxlength="500"></textarea></label>
<label>Pagamento<select id="payment"><option>Pix</option><option>Cartão de Débito</option><option>Cartão de Crédito</option><option>Dinheiro</option></select></label><label id="cashlabel" style="display:none">Troco para<input id="cash" type="number" min="0" step=".01"></label><button id="send" class="green" onclick="sendOrder()">Confirmar pedido</button></section></main>
<section id="done" class="panel"><h2>Pedido realizado!</h2><p id="order"></p><p>Seu código de confirmação da entrega:</p><div id="code" class="code"></div><p>Guarde este código e informe ao entregador somente quando ele estiver entregando seu pedido. Não compartilhe antes.</p><button onclick="copyCode()">Copiar código</button><p id="copymsg"></p></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://oasxlmfwkkubabyvqama.supabase.co','sb_publishable_r3Ob9dbgz52-_ziLLe9-_w_wvimzPkk',{auth:{persistSession:false,autoRefreshToken:false}}),storeId=new URLSearchParams(location.search).get('loja');let products=[],cart=[],requestId=crypto.randomUUID();
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('payment').onchange=()=>document.getElementById('cashlabel').style.display=document.getElementById('payment').value==='Dinheiro'?'block':'none';
function draw(){document.getElementById('products').innerHTML=products.map((p,i)=>'<div class="item"><span><b>'+safe(p.name)+'</b><br>'+money(p.price)+'</span><button onclick="add('+i+')">Adicionar</button></div>').join('');document.getElementById('cart').innerHTML=cart.map((p,i)=>'<div class="cartrow">'+p.qty+'x '+safe(p.name)+' '+money(p.price*p.qty)+' <button onclick="qty('+i+')">Remover</button></div>').join('')||'Carrinho vazio';document.getElementById('total').textContent=money(cart.reduce((s,p)=>s+p.qty*p.price,0));document.getElementById('send').disabled=!cart.length}
function add(i){let p=products[i],x=cart.find(v=>v.id==p.id);if(x)x.qty++;else cart.push({id:String(p.id),name:p.name,price:Number(p.price),qty:1});draw()}function qty(i){cart[i].qty--;if(!cart[i].qty)cart.splice(i,1);draw()}
async function load(){if(!/^[0-9a-f-]{36}$/i.test(storeId||'')){status.textContent='Link inválido.';return}try{let r=await db.rpc('rpc_get_public_delivery_menu',{p_store_id:storeId});if(r.error)throw r.error;products=r.data.products||[];store.textContent=r.data.store_name||'Cardápio Digital';status.style.display='none';if(!products.length){status.textContent='Nenhum produto disponível.';status.style.display='block';return}app.style.display='grid';draw()}catch(e){status.textContent=e.message||'Cardápio indisponível.'}}
async function sendOrder(){let name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),street=document.getElementById('street').value.trim(),number=document.getElementById('number').value.trim(),neighborhood=document.getElementById('neighborhood').value.trim(),payment=document.getElementById('payment').value,total=cart.reduce((s,p)=>s+p.qty*p.price,0),cash=Number(document.getElementById('cash').value)||0;if(!name||!phone||!street||!number||!neighborhood){alert('Preencha nome, telefone e endereço.');return}if(payment==='Dinheiro'&&cash<total){alert('Informe o valor para troco.');return}send.disabled=true;send.textContent='Enviando...';try{let r=await db.rpc('rpc_create_public_delivery_order',{p_store_id:storeId,p_client_name:name,p_client_phone:phone,p_address:street+', Nº '+number+' - '+neighborhood+' '+document.getElementById('complement').value,p_payment:payment,p_cash_given:cash,p_observation:document.getElementById('obs').value,p_items:cart.map(p=>({id:p.id,qty:p.qty})),p_request_id:requestId});if(r.error)throw r.error;if(!r.data||r.data.success!==true||!/^\d{6}$/.test(String(r.data.code||'')))throw Error(r.data&&r.data.message||'Não foi possível confirmar o código. Fale com a loja antes de repetir.');app.style.display='none';status.style.display='none';done.style.display='block';order.textContent='Pedido #'+r.data.display_id+' confirmado. Total: '+money(r.data.total);code.textContent=r.data.code;try{sessionStorage.setItem('vortex_delivery_result_'+storeId,JSON.stringify({code:r.data.code,display_id:r.data.display_id,total:r.data.total}))}catch(e){}}catch(e){alert(e.message||'Falha ao enviar pedido.')}finally{send.disabled=false;send.textContent='Confirmar pedido';draw()}}
function copyCode(){navigator.clipboard.writeText(code.textContent).then(()=>copymsg.textContent='Código copiado!').catch(()=>copymsg.textContent='Selecione e copie o código exibido.')}
try{let saved=JSON.parse(sessionStorage.getItem('vortex_delivery_result_'+storeId)||'null');if(saved&&/^\d{6}$/.test(saved.code)){status.style.display='none';app.style.display='none';done.style.display='block';order.textContent='Pedido #'+saved.display_id+' confirmado. Total: '+money(saved.total);code.textContent=saved.code}else load()}catch(e){load()}
</script></body></html>
