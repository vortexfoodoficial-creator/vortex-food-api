<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Food - Cardápio Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #ff4757;
            margin: 0 0 5px 0;
        }
        .subtitle {
            color: #747d8c;
            font-size: 14px;
        }
        .product-card {
            background: #ffffff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: #2f3542;
        }
        .product-desc {
            font-size: 14px;
            color: #57606f;
            margin: 8px 0;
        }
        .product-price {
            font-size: 16px;
            font-weight: bold;
            color: #2ed573;
            margin-bottom: 10px;
        }
        .btn-add {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-add:active {
            background-color: #ff6b81;
        }
        .loading {
            text-align: center;
            color: #a4b0be;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍔 Vortex Food</h1>
        <div class="subtitle">O seu delivery favorito online</div>
    </header>

    <div id="product-list">
        <div class="loading">A carregar o cardápio da nuvem...</div>
    </div>

    <script>
        // URL da nossa API no Render
        const API_URL = 'https://vortex-food-api.onrender.com/products';

        async function carregarCardapio() {
            const container = document.getElementById('product-list');
            
            try {
                const resposta = await fetch(API_URL);
                const dados = await resposta.json();

                if (dados.success && dados.products.length > 0) {
                    container.innerHTML = ''; // Limpa o carregando
                    
                    dados.products.forEach(produto => {
                        container.innerHTML += `
                            <div class="product-card">
                                <div class="product-name">${produto.name}</div>
                                <div class="product-desc">${produto.description || 'Delicioso e preparado na hora.'}</div>
                                <div class="product-price">R$ ${Number(produto.price).toFixed(2)}</div>
                                <button class="btn-add" onclick="alert('Produto selecionado: ${produto.name}')">Adicionar ao Carrinho</button>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center;">Nenhum produto disponível no momento.</p>';
                }
            } catch (erro) {
                console.error('Erro ao buscar produtos:', erro);
                container.innerHTML = '<p style="text-align: center; color: #ff4757;">Erro ao conectar com o servidor. Tente novamente mais tarde.</p>';
            }
        }

        // Chama a função assim que a página abrir
        carregarCardapio();
    </script>

</body>
</html>
