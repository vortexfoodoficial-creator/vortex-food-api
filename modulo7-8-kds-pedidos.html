<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Food - Módulos 7 & 8: KDS Cozinha</title>
    <style>
        :root {
            --bg-dark: #141c24;
            --panel-dark: #1e272e;
            --primary: #ff4757;
            --primary-gradient: linear-gradient(135deg, #ff4757, #ff6b81);
            --secondary: #2e86de;
            --success: #2ed573;
            --warning: #ffa500;
            --danger: #ea2027;
            --card-white: #ffffff;
            --text-dark: #2f3542;
            --text-muted: #747d8c;
            --border-color: #ced6e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 99;
        }
        .sidebar-overlay.active { display: block; }

        aside.sidebar {
            width: 260px;
            background-color: var(--panel-dark);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        aside.sidebar.collapsed { margin-left: -260px; }

        .sidebar-brand {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-brand img {
            width: 100%;
            max-width: 160px;
            height: auto;
            border-radius: 8px;
        }

        .btn-close-sidebar {
            background: transparent;
            border: none;
            color: #a4b0be;
            font-size: 20px;
            cursor: pointer;
            display: none;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .menu-group-label {
            font-size: 11px;
            font-weight: 800;
            color: #a4b0be;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 18px 10px 8px 10px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: #dcdde1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            margin-bottom: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(255, 71, 87, 0.15);
            color: #ffffff;
            border-left: 4px solid var(--primary);
        }

        main.main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            background-color: var(--bg-dark);
        }

        header.top-header {
            height: 60px;
            background-color: var(--panel-dark);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .btn-toggle-menu {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .content-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .kds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .ticket-card {
            background: var(--panel-dark);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .ticket-title { font-size: 16px; font-weight: 900; }
        .ticket-time { font-size: 11px; color: #a4b0be; font-weight: 700; }

        .ticket-items {
            flex: 1;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ticket-item {
            font-size: 13px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 8px;
            border-radius: 6px;
        }

        .btn-status {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .status-pendente { background: var(--warning); color: #000; }
        .status-preparo { background: var(--secondary); color: #fff; }
        .status-pronto { background: var(--success); color: #fff; }

        /* MODAL CUSTOMIZADO VORTEX FOOD */
        .vortex-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .vortex-modal-overlay.active { display: flex; }
        .vortex-modal-card {
            background: #ffffff !important;
            color: #2f3542 !important;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: modalPop 0.25s ease-out;
        }
        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .vortex-modal-card p {
            color: #2f3542 !important;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .btn-vortex-modal {
            width: 100%;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        @media (max-width: 768px) {
            aside.sidebar {
                position: fixed;
                top: 0; left: 0; height: 100%;
                margin-left: -260px;
            }
            aside.sidebar.mobile-open { margin-left: 0 !important; }
            .btn-close-sidebar { display: block; }
        }
    </style>
</head>
<body>

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside id="mainSidebar" class="sidebar">
        <div class="sidebar-brand">
            <img src="https://sjwddjcsrtudbvqnmhyd.supabase.co/storage/v1/object/public/assets/1791939902279.jpg" alt="Vortex Food">
            <button class="btn-close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>

        <nav class="sidebar-menu">
            <div class="menu-group-label">Operação & Cozinha</div>
            <div class="menu-item active">🍳 Módulos 7 & 8: KDS Cozinha</div>
            <div class="menu-item" onclick="window.location.href='modulo5-mesas.html'">🍽️ Módulo 5: Mesas</div>
            <div class="menu-item" onclick="window.location.href='modulo3-pdv.html'">🖥️ Módulo 3: PDV Caixa</div>
            
            <div class="menu-group-label">Navegação</div>
            <div class="menu-item" onclick="window.location.href='dashboard.html'">📊 Voltar ao Dashboard</div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <button class="btn-toggle-menu" onclick="toggleSidebar()">☰ Menu</button>
            <div style="font-weight: 800; font-size: 13px;">Módulos 7 & 8 — KDS (Monitor de Cozinha)</div>
            <div style="font-size: 11px; color: var(--success);">● Sincronizado em Tempo Real</div>
        </header>

        <div class="content-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="font-weight: 800;">Pedidos em Produção</h3>
                <button style="background: var(--primary-gradient); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;" onclick="adicionarPedidoTeste()">+ Simular Novo Pedido</button>
            </div>

            <div id="kdsGrid" class="kds-grid">
            </div>
        </div>
    </main>

    <!-- MODAL CUSTOMIZADO VORTEX FOOD -->
    <div id="vortexModal" class="vortex-modal-overlay">
        <div class="vortex-modal-card">
            <p id="vortexModalText">Mensagem do Sistema</p>
            <button class="btn-vortex-modal" onclick="fecharVortexModal()">OK</button>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('mainSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('mobile-open');
                overlay.classList.toggle('active');
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        function mostrarAviso(mensagem) {
            document.getElementById('vortexModalText').innerText = mensagem;
            document.getElementById('vortexModal').classList.add('active');
        }

        function fecharVortexModal() {
            document.getElementById('vortexModal').classList.remove('active');
        }

        let pedidosKDS = JSON.parse(localStorage.getItem('vortex_kds')) || [
            { id: 101, origem: 'Mesa 03', itens: ['2x Vortex Burger Duplo', '1x Batata Rústica M'], status: 'Pendente', hora: '09:40' },
            { id: 102, origem: 'PDV Balcão', itens: ['1x Smash Cheeseburger', '1x Coca-Cola 350ml'], status: 'Em Preparo', hora: '09:45' }
        ];

        function carregarKDS() {
            const grid = document.getElementById('kdsGrid');
            grid.innerHTML = '';

            if (pedidosKDS.length === 0) {
                grid.innerHTML = '<div style="color: var(--text-muted); font-size: 13px; grid-column: 1/-1; text-align: center; margin-top: 40px;">Nenhum pedido ativo na cozinha no momento.</div>';
                return;
            }

            pedidosKDS.forEach((p, index) => {
                let btnClass = 'status-pendente';
                let btnText = 'Iniciar Preparo';
                let nextStatus = 'Em Preparo';

                if (p.status === 'Em Preparo') {
                    btnClass = 'status-preparo';
                    btnText = 'Marcar como Pronto';
                    nextStatus = 'Pronto';
                } else if (p.status === 'Pronto') {
                    btnClass = 'status-pronto';
                    btnText = 'Concluir / Arquivar';
                    nextStatus = 'Concluido';
                }

                let itensHtml = '';
                p.itens.forEach(item => {
                    itensHtml += `<div class="ticket-item">• ${item}</div>`;
                });

                grid.innerHTML += `
                    <div class="ticket-card">
                        <div>
                            <div class="ticket-header">
                                <span class="ticket-title">Pedido #${p.id} (${p.origem})</span>
                                <span class="ticket-time">${p.hora}</span>
                            </div>
                            <div class="ticket-items">
                                ${itensHtml}
                            </div>
                        </div>
                        <div>
                            <div style="font-size: 10px; font-weight: 800; color: #a4b0be; margin-bottom: 4px;">ESTADO: ${p.status}</div>
                            <button class="btn-status ${btnClass}" onclick="avancarStatus(${index}, '${nextStatus}')">${btnText}</button>
                        </div>
                    </div>
                `;
            });

            localStorage.setItem('vortex_kds', JSON.stringify(pedidosKDS));
        }

        function avancarStatus(index, novoStatus) {
            const p = pedidosKDS[index];
            if (novoStatus === 'Concluido') {
                pedidosKDS.splice(index, 1);
                carregarKDS();
                mostrarAviso(`Pedido #${p.id} concluído e arquivado com sucesso!`);
            } else {
                pedidosKDS[index].status = novoStatus;
                carregarKDS();
                mostrarAviso(`Pedido #${p.id} alterado para "${novoStatus}"!`);
            }
        }

        function adicionarPedidoTeste() {
            const novoId = Math.floor(100 + Math.random() * 900);
            const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            pedidosKDS.push({
                id: novoId,
                origem: 'Mesa ' + Math.floor(1 + Math.random() * 10),
                itens: ['1x Vortex Burger Duplo', '2x Coca-Cola 350ml'],
                status: 'Pendente',
                hora: agora
            });
            carregarKDS();
            mostrarAviso(`Novo pedido #${novoId} recebido na cozinha!`);
        }

        carregarKDS();
    </script>
</body>
</html>
