<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex Food - Mesas & Comandas</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 99;
    }

    /* Menu Lateral Padronizado */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 100;
      overflow-y: auto;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
    }

    .logo-icon { font-size: 1.5rem; }

    .close-sidebar-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .sidebar-nav {
      padding: 15px 10px;
      flex: 1;
    }

    .nav-section { margin-bottom: 20px; }

    .nav-section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0 10px 8px;
      display: block;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 4px;
      transition: all 0.2s ease;
      font-size: 0.90rem;
    }

    .nav-link:hover, .nav-link.active {
      background-color: rgba(249, 115, 22, 0.15);
      color: var(--primary);
    }

    .nav-icon { font-size: 1.1rem; }

    /* Conteúdo Principal */
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 20px 20px 80px 20px;
      width: calc(100% - 260px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .toggle-btn {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    header h1 { font-size: 1.5rem; }

    /* Painel de Configurações do QR Code */
    .config-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .config-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .config-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .config-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Switch Toggle */
    .switch-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border);
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(24px); }

    .btn-print-qrcodes {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Status das Mesas */
    .status-legend {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.free { background: var(--success); }
    .dot.busy { background: var(--danger); }
    .dot.closing { background: var(--warning); }

    /* Grid de Mesas */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .table-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 150px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .table-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    .table-card.free { border-color: var(--success); }
    .table-card.busy { border-color: var(--danger); }
    .table-card.closing { border-color: var(--warning); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
      100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-number { font-size: 1.2rem; font-weight: bold; }

    .table-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .table-card.free .table-badge { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .table-card.busy .table-badge { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .table-card.closing .table-badge { background: rgba(234, 179, 8, 0.2); color: var(--warning); }

    .table-body { margin-top: 15px; }
    .table-total { font-size: 1.3rem; font-weight: bold; }
    .table-time { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

    /* Modais */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .comanda-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .comanda-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .add-product-select {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .add-product-select select {
      flex: 1;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
    }

    .btn-add-item {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-action.close-table { background: var(--warning); color: #000; }
    .btn-action.pay-table { background: var(--success); color: white; }
    .btn-action.open-table { background: var(--primary); color: white; }

    /* Estilos do Checkout/Pagamento da Mesa */
    .payment-grid-table {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 15px 0;
    }

    .pay-btn-table {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 5px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      text-align: center;
      font-weight: 600;
    }

    .pay-btn-table.selected {
      border-color: var(--primary);
      background: rgba(249, 115, 22, 0.15);
      color: var(--primary);
    }

    .cash-change-box {
      display: none;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .cash-change-box.active { display: block; }

    .cash-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .cash-input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .cash-input-group input {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
    }

    .change-result {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--success);
      display: flex;
      justify-content: space-between;
    }

    /* Área de Impressão de QR Codes */

      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
