<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Food - Módulo 3: PDV Caixa</title>
    <style>
        :root {
            --bg-dark: #141c24;
            --panel-dark: #1e272e;
            --primary: #ff4757;
            --primary-gradient: linear-gradient(135deg, #ff4757, #ff6b81);
            --secondary: #2e86de;
            --success: #2ed573;
            --warning: #ffa500;
            --danger: #ea2027;
            --card-white: #ffffff;
            --text-dark: #2f3542;
            --text-muted: #747d8c;
            --border-color: #ced6e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 99;
        }
        .sidebar-overlay.active { display: block; }

        aside.sidebar {
            width: 260px;
            background-color: var(--panel-dark);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        aside.sidebar.collapsed { margin-left: -260px; }

        .sidebar-brand {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-brand img {
            width: 100%;
            max-width: 160px;
            height: auto;
            border-radius: 8px;
        }

        .btn-close-sidebar {
            background: transparent;
            border: none;
            color: #a4b0be;
            font-size: 20px;
            cursor: pointer;
            display: none;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .menu-group-label {
            font-size: 11px;
            font-weight: 800;
            color: #a4b0be;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 18px 10px 8px 10px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: #dcdde1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            margin-bottom: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(255, 71, 87, 0.15);
            color: #ffffff;
            border-left: 4px solid var(--primary);
        }

        main.main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            background-color: var(--bg-dark);
        }

        header.top-header {
            height: 60px;
            background-color: var(--panel-dark);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .btn-toggle-menu {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .content-body {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 15px;
            padding: 15px;
            overflow: hidden;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .product-card {
            background: var(--panel-dark);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 110px;
        }

        .product-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .card-container-white {
            background: var(--card-white);
            color: var(--text-dark) !important;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .card-container-white h3, 
        .card-container-white label,
        .card-container-white span,
        .card-container-white strong {
            color: var(--text-dark) !important;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 6px 8px;
            background: #f8f9fa;
            border-radius: 6px;
            align-items: center;
        }

        /* MODAL CUSTOMIZADO VORTEX FOOD */
        .vortex-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .vortex-modal-overlay.active { display: flex; }
        .vortex-modal-card {
            background: #ffffff !important;
            color: #2f3542 !important;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: modalPop 0.25s ease-out;
        }
        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .vortex-modal-card p {
            color: #2f3542 !important;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .btn-vortex-modal {
            width: 100%;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        @media (max-width: 900px) {
            .content-body { grid-template-columns: 1fr; overflow-y: auto; }
            .card-container-white { height: auto; }
        }

        @media (max-width: 768px) {
            aside.sidebar {
                position: fixed;
                top: 0; left: 0; height: 100%;
                margin-left: -260px;
            }
            aside.sidebar.mobile-open { margin-left: 0 !important; }
            .btn-close-sidebar { display: block; }
        }
    </style>
</head>
<body>

    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside id="mainSidebar" class="sidebar">
        <div class="sidebar-brand">
            <img src="https://sjwddjcsrtudbvqnmhyd.supabase.co/storage/v1/object/public/assets/1791939902279.jpg" alt="Vortex Food">
            <button class="btn-close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>

        <nav class="sidebar-menu">
            <div class="menu-group-label">Operação</div>
            <div class="menu-item active">🖥️ Módulo 3: PDV Caixa</div>
            <div class="menu-item" onclick="window.location.href='modulo2-cardapio.html'">🍔 Módulo 2: Cardápio</div>
            <div class="menu-item" onclick="window.location.href='modulo5-mesas.html'">🍽️ Módulo 5: Mesas</div>
            
            <div class="menu-group-label">Navegação</div>
            <div class="menu-item" onclick="window.location.href='dashboard.html'">📊 Voltar ao Dashboard</div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <button class="btn-toggle-menu" onclick="toggleSidebar()">☰ Menu</button>
            <div style="font-weight: 800; font-size: 13px;">Módulo 3 — Frente de Caixa (PDV)</div>
            <div style="font-size: 11px; color: var(--success);">● Sincronizado via LocalStorage</div>
        </header>

        <div class="content-body">
            <!-- CATÁLOGO DE PRODUTOS -->
            <section style="display: flex; flex-direction: column; overflow: hidden;">
                <h3 style="margin-bottom: 12px; font-weight: 800;">Catálogo de Venda</h3>
                <div id="produtosGrid" class="products-grid">
                    <!-- Preenchido via JavaScript -->
                </div>
            </section>

            <!-- CARRINHO / FECHAMENTO -->
            <section class="card-container-white">
                <h3 style="font-weight: 800; border-bottom: 2px solid #edf2f7; padding-bottom: 8px;">Carrinho Atual</h3>
                
                <div id="listaCarrinho" class="cart-items">
                    <!-- Itens do carrinho -->
                </div>

                <div style="font-size: 16px; font-weight: 900; border-top: 1px dashed var(--border-color); padding-top: 8px; margin-top: 8px; display: flex; justify-content: space-between;">
                    <span>TOTAL:</span>
                    <span id="totalCarrinho">R$ 0,00</span>
                </div>

                <button style="width: 100%; background: var(--primary-gradient); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 12px;" onclick="finalizarVenda()">Finalizar Venda (F2)</button>
            </section>
        </div>
    </main>

    <!-- MODAL CUSTOMIZADO VORTEX FOOD -->
    <div id="vortexModal" class="vortex-modal-overlay">
        <div class="vortex-modal-card">
            <p id="vortexModalText">Mensagem do Sistema</p>
            <button class="btn-vortex-modal" onclick="fecharVortexModal()">OK</button>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('mainSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('mobile-open');
                overlay.classList.toggle('active');
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        function mostrarAviso(mensagem) {
            document.getElementById('vortexModalText').innerText = mensagem;
            document.getElementById('vortexModal').classList.add('active');
        }

        function fecharVortexModal() {
            document.getElementById('vortexModal').classList.remove('active');
        }

        let carrinho = [];

        function carregarCatalogoPDV() {
            const produtos = JSON.parse(localStorage.getItem('vortex_produtos')) || [
                { nome: 'Vortex Burger Duplo', categoria: 'Burgers', preco: 38.00 },
                { nome: 'Smash Cheeseburger', categoria: 'Burgers', preco: 26.00 },
                { nome: 'Batata Rústica M', categoria: 'Porções', preco: 18.00 },
                { nome: 'Coca-Cola 350ml', categoria: 'Bebidas', preco: 8.00 }
            ];

            const grid = document.getElementById('produtosGrid');
            grid.innerHTML = '';

            produtos.forEach((p, index) => {
                grid.innerHTML += `
                    <div class="product-card" onclick="adicionarAoCarrinho('${p.nome}', ${p.preco})">
                        <div style="font-size: 13px; font-weight: 800; color: #ffffff;">${p.nome}</div>
                        <div style="font-size: 14px; font-weight: 900; color: var(--success);">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
                    </div>
                `;
            });
        }

        function adicionarAoCarrinho(nome, preco) {
            carrinho.push({ nome, preco });
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            const container = document.getElementById('listaCarrinho');
            container.innerHTML = '';
            let total = 0;

            if (carrinho.length === 0) {
                container.innerHTML = '<div style="text-align:center; font-size:12px; color:var(--text-muted); margin-top:20px;">Carrinho vazio. Selecione os produtos ao lado.</div>';
            } else {
                carrinho.forEach((item, index) => {
                    total += item.preco;
                    container.innerHTML += `
                        <div class="cart-item">
                            <span>${item.nome}</span>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <strong>R$ ${item.preco.toFixed(2).replace('.', ',')}</strong>
                                <button style="background:var(--danger); color:white; border:none; padding:2px 6px; border-radius:4px; cursor:pointer; font-size:10px;" onclick="removerItem(${index})">✕</button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('totalCarrinho').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function removerItem(index) {
            carrinho.splice(index, 1);
            atualizarCarrinho();
        }

        function finalizarVenda() {
            if (carrinho.length === 0) {
                mostrarAviso('O carrinho está vazio. Adicione itens antes de finalizar.');
                return;
            }

            const total = carrinho.reduce((acc, item) => acc + item.preco, 0);
            
            let financeiro = JSON.parse(localStorage.getItem('vortex_financeiro')) || [];
            financeiro.push({ desc: 'Venda PDV Caixa', tipo: 'Entrada', valor: total });
            localStorage.setItem('vortex_financeiro', JSON.stringify(financeiro));

            // Envia para o KDS
            let kds = JSON.parse(localStorage.getItem('vortex_kds')) || [];
            const novoId = Math.floor(100 + Math.random() * 900);
            const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            kds.push({
                id: novoId,
                origem: 'PDV Balcão',
                itens: carrinho.map(c => c.nome),
                status: 'Pendente',
                hora: agora
            });
            localStorage.setItem('vortex_kds', JSON.stringify(kds));

            mostrarAviso(`Venda finalizada com sucesso!\nTotal recebido: R$ ${total.toFixed(2).replace('.', ',')}`);
            carrinho = [];
            atualizarCarrinho();
        }

        // Atalho F2 para finalizar venda
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F2') {
                e.preventDefault();
                finalizarVenda();
            }
        });

        carregarCatalogoPDV();
    </script>
</body>
</html>
