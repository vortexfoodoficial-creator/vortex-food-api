<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Código de entrega - Vortex Food</title>
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8; --orange:#f97316; --green:#22c55e; --border:#334155; }
    * { box-sizing:border-box; font-family:Segoe UI,Arial,sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--text); }
    .card { width:100%; max-width:420px; padding:28px 22px; border:1px solid var(--border); border-radius:20px; background:var(--card); text-align:center; box-shadow:0 16px 40px #0005; }
    .logo { font-size:13px; letter-spacing:2px; color:var(--orange); font-weight:800; }
    h1 { font-size:23px; margin:16px 0 8px; }
    p { color:var(--muted); line-height:1.55; font-size:14px; }
    .code { margin:24px 0 16px; padding:18px 10px; border:1px dashed var(--green); border-radius:14px; color:var(--green); font-size:38px; font-weight:900; letter-spacing:8px; font-variant-numeric:tabular-nums; }
    button { width:100%; border:0; border-radius:10px; padding:13px; background:var(--orange); color:white; font-weight:800; font-size:15px; cursor:pointer; }
    .status { margin-top:18px; font-size:13px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">VORTEX FOOD</div>
    <h1>Seu código de confirmação</h1>
    <p>Mostre este código ao entregador somente quando ele estiver entregando seu pedido.</p>
    <div id="codeDisplay" class="code hidden">------</div>
    <button id="copyButton" class="hidden" type="button">Copiar código</button>
    <p id="status" class="status">Verificando seu link privado...</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async function() {
      const SUPABASE_URL = 'https://oasxlmfwkkubabyvqama.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_r3Ob9dbgz52-_ziLLe9-_w_wvimzPkk';
      const params = new URLSearchParams(window.location.search);
      const storeId = params.get('store') || '';
      const orderId = params.get('pedido') || '';
      const accessToken = params.get('token') || '';
      const status = document.getElementById('status');
      const display = document.getElementById('codeDisplay');
      const copyButton = document.getElementById('copyButton');

      if (!/^[0-9a-f-]{36}$/i.test(storeId) || !orderId || !/^[a-f0-9]{64}$/.test(accessToken)) {
        status.textContent = 'Link inválido. Solicite um novo link ao estabelecimento.';
        return;
      }

      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
        });
        const { data, error } = await client.rpc('rpc_get_delivery_code', {
          p_store_id: storeId,
          p_order_id: orderId,
          p_access_token: accessToken
        });
        if (error) throw error;
        if (!data || data.success !== true || !/^\\d{6}$/.test(String(data.code || ''))) {
          throw new Error(data && data.message ? data.message : 'Não foi possível localizar o código. Solicite um novo link ao estabelecimento.');
        }

        display.textContent = String(data.code);
        display.classList.remove('hidden');
        copyButton.classList.remove('hidden');
        status.textContent = 'Guarde este código e informe ao entregador quando receber o pedido.';
        copyButton.addEventListener('click', async function() {
          try {
            await navigator.clipboard.writeText(String(data.code));
            copyButton.textContent = 'Código copiado!';
          } catch (copyError) {
            status.textContent = 'Selecione e copie o código exibido acima.';
          }
        });
      } catch (error) {
        status.textContent = error.message || 'Não foi possível carregar seu código. Solicite um novo link ao estabelecimento.';
      }
    })();
  </script>
</body>
</html>
